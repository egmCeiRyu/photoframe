<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindAR Debug</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#fff;
font-family:sans-serif;
}
#ar-container{
position:fixed;
inset:0;
}
#panel{
position:fixed;
top:20px;
left:20px;
right:20px;
z-index:50;
}
button{
padding:14px 24px;
font-size:18px;
}
#log{
margin-top:15px;
font-size:14px;
white-space:pre-line;
}
</style>
</head>
<body>

<div id="ar-container"></div>

<div id="panel">
<button onclick="boot()">START AR</button>
<div id="log">Ready...</div>
</div>

<script>
function log(msg){
document.getElementById("log").innerText += "\n" + msg;
}

async function boot(){
try{
log("Clicked");

log("Creating MindAR...");
const mindarThree = new window.MINDAR.IMAGE.MindARThree({
container: document.querySelector("#ar-container"),
imageTargetSrc:"./targets.mind"
});

log("Loading renderer...");
const {renderer, scene, camera} = mindarThree;

log("Loading image...");
const loader = new THREE.TextureLoader();

const texture = await loader.loadAsync("./anime-mascot.png");

log("Creating mesh...");
const mesh = new THREE.Mesh(
new THREE.PlaneGeometry(1,2),
new THREE.MeshBasicMaterial({
map:texture,
transparent:true
})
);

const anchor = mindarThree.addAnchor(0);
anchor.group.add(mesh);

log("Starting camera...");
await mindarThree.start();

log("SUCCESS");

renderer.setAnimationLoop(()=>{
mesh.lookAt(camera.position);
renderer.render(scene,camera);
});

}catch(e){
log("ERROR:");
log(e.message);
console.error(e);
}
}
</script>

</body>
</html>
