<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<title>AR Selfie Lock Scan</title>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image-three.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

#ar-container{
position:fixed;
inset:0;
width:100%;
height:100%;
}

#loading{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#000;
color:#fff;
font-size:18px;
z-index:99;
text-align:center;
padding:20px;
}

#guide{
position:fixed;
top:18px;
left:15px;
right:15px;
text-align:center;
color:#fff;
font-size:16px;
font-weight:bold;
z-index:20;
text-shadow:0 2px 8px rgba(0,0,0,.7);
}

#captureBtn{
position:fixed;
bottom:24px;
left:50%;
transform:translateX(-50%);
z-index:20;
border:none;
border-radius:50px;
width:84px;
height:84px;
font-size:34px;
color:#fff;
background:#4cc9f0;
box-shadow:0 0 30px rgba(76,201,240,.8);
}

#resetBtn{
position:fixed;
bottom:34px;
left:24px;
z-index:20;
border:none;
border-radius:50%;
width:62px;
height:62px;
font-size:28px;
color:#fff;
background:rgba(255,255,255,.18);
backdrop-filter:blur(8px);
}

#flash{
position:fixed;
inset:0;
background:#fff;
opacity:0;
pointer-events:none;
z-index:100;
}
</style>
</head>

<body>

<div id="ar-container"></div>

<div id="loading">Opening Selfie AR...</div>
<div id="guide">マーカーを前カメラに映してください</div>
<div id="flash"></div>

<button id="resetBtn">↺</button>
<button id="captureBtn">📸</button>

<script>
let renderer, scene, camera, mascot, anchor, mindarThree;
let locked = false;

window.addEventListener("load", startAR);

async function startAR(){

try{

mindarThree = new window.MINDAR.IMAGE.MindARThree({
container: document.querySelector("#ar-container"),
imageTargetSrc:"./targets.mind",
uiScanning:false,
uiLoading:false,
uiError:false
});

renderer = mindarThree.renderer;
scene = mindarThree.scene;
camera = mindarThree.camera;

renderer.preserveDrawingBuffer = true;
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);

const light = new THREE.HemisphereLight(0xffffff,0xbbbbff,1.2);
scene.add(light);

const texture = await new THREE.TextureLoader().loadAsync("./anime-mascot.png");
texture.encoding = THREE.sRGBEncoding;

const material = new THREE.MeshBasicMaterial({
map:texture,
transparent:true,
alphaTest:0.35,
side:THREE.DoubleSide
});

mascot = new THREE.Mesh(
new THREE.PlaneGeometry(1.2,2.5),
material
);

mascot.position.set(0,1.15,0);

anchor = mindarThree.addAnchor(0);
anchor.group.add(mascot);

/* detectou marker uma vez */
anchor.onTargetFound = ()=>{

if(locked) return;

locked = true;

/* posição global */
mascot.updateMatrixWorld(true);

const pos = new THREE.Vector3();
const quat = new THREE.Quaternion();
const scale = new THREE.Vector3();

mascot.matrixWorld.decompose(pos,quat,scale);

/* solta do marker */
anchor.group.remove(mascot);
scene.add(mascot);

mascot.position.copy(pos);
mascot.quaternion.copy(quat);
mascot.scale.copy(scale);

document.getElementById("guide").innerHTML = "Selfie Ready 📸";
};

await mindarThree.start();

/* FORÇA SELFIE CAMERA */
const video = document.querySelector("video");

const stream = await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"user",
width:{ideal:1280},
height:{ideal:720}
},
audio:false
});

video.srcObject = stream;
await video.play();
video.style.transform = "scaleX(-1)";
video.style.objectFit = "cover";

document.getElementById("loading").style.display = "none";

renderer.setAnimationLoop(()=>{

if(mascot){
mascot.lookAt(camera.position);
}

renderer.render(scene,camera);

});

}catch(err){

document.getElementById("loading").innerHTML =
"Camera failed.<br>Use HTTPS and allow permission.";

console.error(err);
}
}

/* flash */
function flashEffect(){

const flash = document.getElementById("flash");

flash.style.transition="none";
flash.style.opacity="0.92";

setTimeout(()=>{
flash.style.transition="opacity .35s ease";
flash.style.opacity="0";
},50);
}

/* FOTO COM OPÇÃO SALVAR */
async function takePhoto(){

flashEffect();

renderer.render(scene,camera);

const glCanvas = renderer.domElement;
const video = document.querySelector("video");

const output = document.createElement("canvas");
output.width = glCanvas.width;
output.height = glCanvas.height;

const ctx = output.getContext("2d");

/* selfie espelhada */
ctx.save();
ctx.scale(-1,1);
ctx.drawImage(video,-output.width,0,output.width,output.height);
ctx.restore();

/* personagem */
ctx.drawImage(glCanvas,0,0,output.width,output.height);

output.toBlob(async(blob)=>{

const file = new File(
[blob],
"ar-selfie.jpg",
{type:"image/jpeg"}
);

/* iPhone / Android */
if(navigator.canShare && navigator.canShare({files:[file]})){

try{
await navigator.share({
files:[file],
title:"AR Selfie",
text:"Photo"
});
return;
}catch(e){}
}

/* fallback */
const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;
a.download = "ar-selfie.jpg";
a.click();

setTimeout(()=>{
URL.revokeObjectURL(url);
},1000);

},"image/jpeg",0.95);
}

/* reset */
function resetScan(){
location.reload();
}

document.getElementById("captureBtn").addEventListener("click",takePhoto);
document.getElementById("resetBtn").addEventListener("click",resetScan);

window.addEventListener("resize",()=>{

if(renderer){
renderer.setSize(window.innerWidth,window.innerHeight);
}

});
</script>

</body>
</html>
