<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<title>AR Scan to Selfie Mascot</title>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image-three.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

#app{
position:fixed;
inset:0;
overflow:hidden;
background:#000;
}

video,canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}

#guide{
position:fixed;
top:18px;
left:15px;
right:15px;
z-index:20;
text-align:center;
color:#fff;
font-size:17px;
font-weight:700;
text-shadow:0 2px 8px rgba(0,0,0,.7);
}

#loading{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#000;
color:#fff;
font-size:18px;
z-index:100;
}

#captureBtn,#resetBtn{
position:fixed;
z-index:30;
border:none;
color:#fff;
}

#captureBtn{
bottom:24px;
left:50%;
transform:translateX(-50%);
width:86px;
height:86px;
border-radius:50%;
font-size:34px;
background:#4cc9f0;
box-shadow:0 0 30px rgba(76,201,240,.8);
display:none;
}

#resetBtn{
bottom:36px;
left:24px;
width:60px;
height:60px;
border-radius:50%;
font-size:28px;
background:rgba(255,255,255,.18);
display:none;
backdrop-filter:blur(8px);
}

#flash{
position:fixed;
inset:0;
background:#fff;
opacity:0;
pointer-events:none;
z-index:50;
}
</style>
</head>
<body>

<div id="app"></div>

<div id="loading">カメラを起動しています...</div>
<div id="guide">① マーカーをスキャンしてください</div>

<button id="captureBtn">📸</button>
<button id="resetBtn">↺</button>

<div id="flash"></div>

<script>
const app = document.getElementById("app");

let scanAR;
let renderer, scene, camera;
let selfieVideo;
let mascot;
let selfieMode = false;

window.addEventListener("load", startScanner);

/* ETAPA 1 */
async function startScanner(){

try{

scanAR = new window.MINDAR.IMAGE.MindARThree({
container: app,
imageTargetSrc:"./targets.mind",
uiScanning:false,
uiLoading:false,
uiError:false,
videoSettings:{
facingMode:{ideal:"environment"}
}
});

renderer = scanAR.renderer;
scene = scanAR.scene;
camera = scanAR.camera;

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);

const light = new THREE.HemisphereLight(0xffffff,0xbbbbff,1.2);
scene.add(light);

const texture = await new THREE.TextureLoader().loadAsync("./anime-mascot.png");
texture.encoding = THREE.sRGBEncoding;

mascot = new THREE.Mesh(
new THREE.PlaneGeometry(1.8,3.5),
new THREE.MeshBasicMaterial({
map:texture,
transparent:true,
alphaTest:0.35
})
);

mascot.position.set(0,1.2,0);

const anchor = scanAR.addAnchor(0);
anchor.group.add(mascot);

anchor.onTargetFound = async ()=>{
await enterSelfieMode();
};

await scanAR.start();

document.getElementById("loading").style.display="none";

renderer.setAnimationLoop(()=>{
renderer.render(scene,camera);
});

}catch(e){
document.getElementById("loading").innerHTML="カメラエラー";
}
}

/* ETAPA 2 */
async function enterSelfieMode(){

if(selfieMode) return;
selfieMode = true;

document.getElementById("guide").innerHTML =
"② キャラクターと一緒に写真を撮ってください";

await scanAR.stop();

app.innerHTML = "";

selfieVideo = document.createElement("video");
selfieVideo.autoplay = true;
selfieVideo.playsInline = true;
selfieVideo.muted = true;
selfieVideo.style.transform = "scaleX(-1)";
app.appendChild(selfieVideo);

const stream = await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"user",
width:{ideal:1280},
height:{ideal:720}
},
audio:false
});

selfieVideo.srcObject = stream;
await selfieVideo.play();

renderer = new THREE.WebGLRenderer({
alpha:true,
antialias:true,
preserveDrawingBuffer:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.domElement.style.pointerEvents="none";
app.appendChild(renderer.domElement);

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(
45,
innerWidth/innerHeight,
0.1,
100
);

camera.position.z = 5;

const light = new THREE.HemisphereLight(0xffffff,0xbbbbff,1.2);
scene.add(light);

scene.add(mascot);
mascot.position.set(1.6,-1.0,0);

animateSelfie();

document.getElementById("captureBtn").style.display="block";
document.getElementById("resetBtn").style.display="block";
}

function animateSelfie(){

requestAnimationFrame(animateSelfie);

if(!selfieMode) return;

mascot.lookAt(camera.position);
renderer.render(scene,camera);
}

/* FOTO */
function flash(){

const el = document.getElementById("flash");

el.style.transition="none";
el.style.opacity="0.95";

setTimeout(()=>{
el.style.transition="opacity .35s ease";
el.style.opacity="0";
},40);
}

async function takePhoto(){

flash();

const out = document.createElement("canvas");
out.width = innerWidth;
out.height = innerHeight;

const ctx = out.getContext("2d");

ctx.save();
ctx.scale(-1,1);
ctx.drawImage(selfieVideo,-out.width,0,out.width,out.height);
ctx.restore();

ctx.drawImage(renderer.domElement,0,0,out.width,out.height);

out.toBlob(async(blob)=>{

const file = new File([blob],"ar-selfie.jpg",{type:"image/jpeg"});

if(navigator.canShare && navigator.canShare({files:[file]})){
try{
await navigator.share({
files:[file],
title:"AR Selfie"
});
return;
}catch(e){}
}

const url = URL.createObjectURL(blob);
const a = document.createElement("a");
a.href = url;
a.download = "ar-selfie.jpg";
a.click();

setTimeout(()=>URL.revokeObjectURL(url),1000);

},"image/jpeg",0.95);
}

function resetApp(){
location.reload();
}

document.getElementById("captureBtn").addEventListener("click",takePhoto);
document.getElementById("resetBtn").addEventListener("click",resetApp);

window.addEventListener("resize",()=>{

if(renderer){
renderer.setSize(innerWidth,innerHeight);
}

if(camera){
camera.aspect = innerWidth/innerHeight;
camera.updateProjectionMatrix();
}

});
</script>

</body>
</html>
