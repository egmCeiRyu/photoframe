<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AR Photo Capture HD</title>

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial, sans-serif;
}

canvas{
    position:fixed;
    top:0;
    left:0;
}

#captureBtn{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    width:78px;
    height:78px;
    border-radius:50%;
    border:5px solid white;
    background:red;
    cursor:pointer;
    z-index:10;
}

#menuBtn{
    position:fixed;
    top:20px;
    left:20px;
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:white;
    font-weight:bold;
    z-index:10;
}
</style>
</head>

<body>

<button id="menuBtn">Menu</button>
<button id="captureBtn"></button>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.z = 5;

// =======================================
// RENDERER HD
// =======================================
const renderer = new THREE.WebGLRenderer({
    antialias:true,
    alpha:true,
    preserveDrawingBuffer:true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight,false);
renderer.setClearColor(0x000000,0);

document.body.appendChild(renderer.domElement);

// =======================================
// LIGHT
// =======================================
const light = new THREE.HemisphereLight(0xffffff,0x444444,2);
scene.add(light);

// =======================================
// EXEMPLO PERSONAGEM PLACEHOLDER
// Troque pelo seu GLB
// =======================================
const geometry = new THREE.BoxGeometry(1,2,1);
const material = new THREE.MeshStandardMaterial({
    color:0xff77aa
});

const mascot = new THREE.Mesh(geometry,material);
scene.add(mascot);

// posição direita
mascot.position.set(1,-0.2,0);

// =======================================
// FOTO HD
// =======================================
function takePhoto(){

    const oldW = window.innerWidth;
    const oldH = window.innerHeight;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio*2,3));
    renderer.setSize(oldW,oldH,false);

    renderer.render(scene,camera);

    const dataURL = renderer.domElement.toDataURL("image/png");

    const link = document.createElement("a");
    link.href = dataURL;
    link.download = "AR_Photo.png";
    link.click();

    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(oldW,oldH,false);
}

document.getElementById("captureBtn").addEventListener("click",takePhoto);

// =======================================
// RESPONSIVO
// =======================================
window.addEventListener("resize",()=>{

    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(window.innerWidth,window.innerHeight,false);

});

// =======================================
// LOOP
// =======================================
function animate(){
    requestAnimationFrame(animate);

    mascot.rotation.y += 0.01;

    renderer.render(scene,camera);
}

animate();

</script>
</body>
</html>
