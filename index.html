<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<title>AR Selfie Marker Photo Frame</title>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image-three.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:sans-serif;
}

#ar-container{
position:fixed;
inset:0;
width:100%;
height:100%;
}

#captureBtn{
position:fixed;
bottom:24px;
left:50%;
transform:translateX(-50%);
z-index:20;
border:none;
border-radius:18px;
padding:16px 34px;
font-size:22px;
font-weight:bold;
color:#fff;
background:linear-gradient(135deg,#ff5ca9,#ff84d2);
box-shadow:0 8px 20px rgba(0,0,0,.35);
}

#resetBtn{
position:fixed;
top:18px;
right:18px;
z-index:20;
border:none;
border-radius:14px;
padding:12px 18px;
font-size:15px;
font-weight:bold;
color:#fff;
background:rgba(0,0,0,.55);
backdrop-filter:blur(6px);
}

#guide{
position:fixed;
top:20px;
left:20px;
right:20px;
text-align:center;
z-index:20;
color:#fff;
font-size:16px;
font-weight:bold;
text-shadow:0 2px 8px rgba(0,0,0,.6);
}

#loading{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#000;
color:#fff;
font-size:18px;
z-index:99;
}

#flash{
position:fixed;
inset:0;
background:#fff;
opacity:0;
pointer-events:none;
z-index:100;
}
</style>
</head>

<body>

<div id="ar-container"></div>

<div id="loading">Opening Selfie AR...</div>
<div id="guide">マーカーを前カメラに映してください</div>
<div id="flash"></div>

<button id="resetBtn">↺ Scan</button>
<button id="captureBtn">📸 撮影</button>

<script>
let renderer, scene, camera, mascot, mindarThree;

window.addEventListener("load", startAR);

async function startAR(){

try{

mindarThree = new window.MINDAR.IMAGE.MindARThree({
container: document.querySelector("#ar-container"),
imageTargetSrc: "./targets.mind",
uiScanning: false,
uiLoading: false,
uiError: false,
videoSettings:{
facingMode:"user"
}
});

renderer = mindarThree.renderer;
scene = mindarThree.scene;
camera = mindarThree.camera;

renderer.preserveDrawingBuffer = true;
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);

/* selfie espelhado */
renderer.domElement.style.transform = "scaleX(-1)";

const light = new THREE.HemisphereLight(0xffffff,0xbbbbff,1.2);
scene.add(light);

const texture = await new THREE.TextureLoader().loadAsync("./anime-mascot.png");
texture.encoding = THREE.sRGBEncoding;

const material = new THREE.MeshBasicMaterial({
map:texture,
transparent:true,
alphaTest:0.35,
side:THREE.DoubleSide
});

mascot = new THREE.Mesh(
new THREE.PlaneGeometry(1.2,2.5),
material
);

/* posição acima do marcador */
mascot.position.set(0,1.15,0);

const anchor = mindarThree.addAnchor(0);
anchor.group.add(mascot);

await mindarThree.start();

document.getElementById("loading").style.display="none";

renderer.setAnimationLoop(()=>{

if(mascot){
mascot.lookAt(camera.position);
}

renderer.render(scene,camera);

});

}catch(err){

document.getElementById("loading").innerHTML =
"Failed to start.<br>Allow camera permission.";

console.error(err);
}
}

/* FLASH */
function flashEffect(){

const flash = document.getElementById("flash");

flash.style.transition="none";
flash.style.opacity="0.95";

setTimeout(()=>{
flash.style.transition="opacity .35s ease";
flash.style.opacity="0";
},40);
}

/* FOTO */
function takePhoto(){

flashEffect();

renderer.render(scene,camera);

const glCanvas = renderer.domElement;
const video = document.querySelector("video");

if(!video || !glCanvas) return;

const output = document.createElement("canvas");
output.width = glCanvas.width;
output.height = glCanvas.height;

const ctx = output.getContext("2d");

/* selfie */
ctx.save();
ctx.scale(-1,1);
ctx.drawImage(video,-output.width,0,output.width,output.height);
ctx.restore();

/* personagem */
ctx.drawImage(glCanvas,0,0,output.width,output.height);

const link = document.createElement("a");
link.download = "ar-selfie-photo.jpg";
link.href = output.toDataURL("image/jpeg",0.95);
link.click();
}

/* RESET */
function resetTracking(){
if(mindarThree){
mindarThree.stop();
startAR();
}
}

document.getElementById("captureBtn").addEventListener("click",takePhoto);
document.getElementById("resetBtn").addEventListener("click",resetTracking);

window.addEventListener("resize",()=>{
if(renderer){
renderer.setSize(window.innerWidth,window.innerHeight);
}
});
</script>

</body>
</html>
