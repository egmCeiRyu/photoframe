<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
<title>AR Anime Mascot Photo Frame</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: sans-serif;
}

#ar-container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#title {
  position: fixed;
  top: 14px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #fff;
  font-size: 22px;
  font-weight: bold;
  z-index: 20;
  text-shadow: 0 2px 8px rgba(0,0,0,.7);
}

#guide {
  position: fixed;
  bottom: 95px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #fff;
  font-size: 15px;
  z-index: 20;
  text-shadow: 0 2px 8px rgba(0,0,0,.7);
}

#ui {
  position: fixed;
  bottom: 26px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  z-index: 20;
}

#captureBtn {
  border: none;
  border-radius: 14px;
  padding: 14px 30px;
  font-size: 18px;
  font-weight: bold;
  color: #fff;
  background: linear-gradient(135deg,#ff5ca9,#ff84d2);
  box-shadow: 0 8px 20px rgba(0,0,0,.25);
}

#loading {
  position: fixed;
  inset: 0;
  background: #000;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99;
  font-size: 18px;
}
</style>
</head>

<body>

<div id="ar-container"></div>

<div id="loading">Loading Camera...</div>
<div id="title">AR Anime Mascot Photo Frame</div>
<div id="guide">マーカーをカメラに映してください</div>

<div id="ui">
  <button id="captureBtn">📸 撮影</button>
</div>

<script>
let renderer, scene, camera, mascot;

async function startAR() {
  try {
    const mindarThree = new window.MINDAR.IMAGE.MindARThree({
      container: document.querySelector("#ar-container"),
      imageTargetSrc: "./targets.mind",
      uiScanning: false,
      uiLoading: false,
      uiError: false
    });

    renderer = mindarThree.renderer;
    scene = mindarThree.scene;
    camera = mindarThree.camera;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.2);
    scene.add(light);

    const anchor = mindarThree.addAnchor(0);

    const loader = new THREE.TextureLoader();

    const texture = await loader.loadAsync("./anime-mascot.png");

    const geometry = new THREE.PlaneGeometry(1.1, 2.4);

    const material = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true
    });

    mascot = new THREE.Mesh(geometry, material);
    mascot.position.set(0, 1.15, 0);

    anchor.group.add(mascot);

    await mindarThree.start();

    document.getElementById("loading").style.display = "none";

    renderer.setAnimationLoop(() => {
      if (mascot) {
        mascot.lookAt(camera.position);
      }
      renderer.render(scene, camera);
    });

  } catch (error) {
    document.getElementById("loading").innerHTML =
      "Camera start failed.<br>Please allow camera permission.";
    console.error(error);
  }
}

function takePhoto() {
  const canvas = document.querySelector("canvas");
  if (!canvas) return;

  const link = document.createElement("a");
  link.download = "ar-photo.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

document.getElementById("captureBtn").addEventListener("click", takePhoto);

window.addEventListener("resize", () => {
  if (renderer) {
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
});

startAR();
</script>

</body>
</html>
