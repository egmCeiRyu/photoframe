<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<title>AR Scan Front &gt; Selfie</title>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image-three.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

#ar-container{position:fixed;inset:0;}
#ui{
position:fixed;
inset:0;
pointer-events:none;
z-index:50;
}

#guide{
position:fixed;
top:18px;
left:15px;
right:15px;
text-align:center;
color:#fff;
font-size:17px;
font-weight:700;
text-shadow:0 2px 8px rgba(0,0,0,.7);
}

#loading{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#000;
color:#fff;
z-index:100;
font-size:18px;
}

#captureBtn,#resetBtn{
position:fixed;
pointer-events:auto;
border:none;
color:#fff;
}

#captureBtn{
bottom:24px;
left:50%;
transform:translateX(-50%);
width:86px;
height:86px;
border-radius:50%;
font-size:34px;
background:#4cc9f0;
box-shadow:0 0 30px rgba(76,201,240,.8);
display:none;
}

#resetBtn{
bottom:34px;
left:24px;
width:60px;
height:60px;
border-radius:50%;
font-size:28px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(8px);
display:none;
}

#flash{
position:fixed;
inset:0;
background:#fff;
opacity:0;
pointer-events:none;
z-index:120;
}
</style>
</head>
<body>

<div id="ar-container"></div>

<div id="ui">
<div id="loading">Opening camera...</div>
<div id="guide">1. Escaneie o marcador</div>
<button id="captureBtn">📸</button>
<button id="resetBtn">↺</button>
<div id="flash"></div>
</div>

<script>
let renderer,scene,camera,mindarThree;
let mascot,anchor;
let locked=false;

window.addEventListener("load",startScanMode);

/* ETAPA 1 = CAMERA TRASEIRA PARA ESCANEAR */
async function startScanMode(){

try{

mindarThree = new window.MINDAR.IMAGE.MindARThree({
container:document.querySelector("#ar-container"),
imageTargetSrc:"./targets.mind",
uiScanning:false,
uiLoading:false,
uiError:false,
videoSettings:{
facingMode:{ideal:"environment"}
}
});

renderer = mindarThree.renderer;
scene = mindarThree.scene;
camera = mindarThree.camera;

renderer.preserveDrawingBuffer = true;
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);

const light = new THREE.HemisphereLight(0xffffff,0xbbbbff,1.2);
scene.add(light);

const texture = await new THREE.TextureLoader().loadAsync("./anime-mascot.png");
texture.encoding = THREE.sRGBEncoding;

mascot = new THREE.Mesh(
new THREE.PlaneGeometry(1.2,2.5),
new THREE.MeshBasicMaterial({
map:texture,
transparent:true,
alphaTest:0.35,
side:THREE.DoubleSide
})
);

mascot.position.set(0,1.15,0);

anchor = mindarThree.addAnchor(0);
anchor.group.add(mascot);

/* detectou marcador */
anchor.onTargetFound = async ()=>{

if(locked) return;
locked=true;

/* salva posição mundial */
mascot.updateMatrixWorld(true);

const pos = new THREE.Vector3();
const quat = new THREE.Quaternion();
const scale = new THREE.Vector3();

mascot.matrixWorld.decompose(pos,quat,scale);

/* tira do marker */
anchor.group.remove(mascot);
scene.add(mascot);

mascot.position.copy(pos);
mascot.quaternion.copy(quat);
mascot.scale.copy(scale);

/* muda para selfie */
await switchToSelfie();

};

await mindarThree.start();

document.getElementById("loading").style.display="none";

renderer.setAnimationLoop(()=>{

if(mascot){
mascot.lookAt(camera.position);
}

renderer.render(scene,camera);

});

}catch(e){
document.getElementById("loading").innerHTML="Camera error";
console.error(e);
}
}

/* ETAPA 2 = TROCA PARA SELFIE */
async function switchToSelfie(){

const video = document.querySelector("video");

const newStream = await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"user",
width:{ideal:1280},
height:{ideal:720}
},
audio:false
});

/* para stream antiga */
if(video.srcObject){
video.srcObject.getTracks().forEach(t=>t.stop());
}

video.srcObject = newStream;
await video.play();

video.style.transform="scaleX(-1)";
video.style.objectFit="cover";

document.getElementById("guide").innerHTML="2. Tire sua selfie";
document.getElementById("captureBtn").style.display="block";
document.getElementById("resetBtn").style.display="block";
}

/* FOTO */
function flash(){
const f=document.getElementById("flash");
f.style.transition="none";
f.style.opacity="0.95";
setTimeout(()=>{
f.style.transition="opacity .35s ease";
f.style.opacity="0";
},40);
}

async function takePhoto(){

flash();

renderer.render(scene,camera);

const video = document.querySelector("video");
const gl = renderer.domElement;

const out = document.createElement("canvas");
out.width = gl.width;
out.height = gl.height;

const ctx = out.getContext("2d");

/* selfie espelhada */
ctx.save();
ctx.scale(-1,1);
ctx.drawImage(video,-out.width,0,out.width,out.height);
ctx.restore();

/* personagem */
ctx.drawImage(gl,0,0,out.width,out.height);

out.toBlob(async(blob)=>{

const file = new File([blob],"ar-selfie.jpg",{type:"image/jpeg"});

if(navigator.canShare && navigator.canShare({files:[file]})){
try{
await navigator.share({
files:[file],
title:"AR Selfie"
});
return;
}catch(e){}
}

const url = URL.createObjectURL(blob);
const a = document.createElement("a");
a.href=url;
a.download="ar-selfie.jpg";
a.click();

setTimeout(()=>URL.revokeObjectURL(url),1000);

},"image/jpeg",0.95);
}

/* reset */
function resetAll(){
location.reload();
}

document.getElementById("captureBtn").addEventListener("click",takePhoto);
document.getElementById("resetBtn").addEventListener("click",resetAll);

window.addEventListener("resize",()=>{
if(renderer){
renderer.setSize(innerWidth,innerHeight);
}
});
</script>

</body>
</html>
