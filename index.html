<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<title>ARフォトフレーム</title>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image-three.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}

#app{
position:fixed;
inset:0;
overflow:hidden;
background:#000;
}

video,canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}

#loading{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#000;
color:#fff;
font-size:18px;
z-index:100;
}

#guide{
position:fixed;
top:18px;
left:15px;
right:15px;
z-index:30;
text-align:center;
color:#fff;
font-size:17px;
font-weight:700;
text-shadow:0 2px 8px rgba(0,0,0,.75);
padding:0 8px;
}

#captureBtn,#resetBtn{
position:fixed;
z-index:40;
border:none;
color:#fff;
cursor:pointer;
}

#captureBtn{
bottom:24px;
left:50%;
transform:translateX(-50%);
width:88px;
height:88px;
border-radius:50%;
font-size:34px;
background:#4cc9f0;
box-shadow:0 0 30px rgba(76,201,240,.85);
display:none;
}

#resetBtn{
bottom:36px;
left:22px;
width:62px;
height:62px;
border-radius:50%;
font-size:28px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(8px);
display:none;
}

#flash{
position:fixed;
inset:0;
background:#fff;
opacity:0;
pointer-events:none;
z-index:90;
}
</style>
</head>
<body>

<div id="app"></div>

<div id="loading">カメラを起動しています...</div>
<div id="guide">① マーカーをスキャンしてください</div>

<button id="captureBtn">📸</button>
<button id="resetBtn">↺</button>

<div id="flash"></div>

<script>
const app = document.getElementById("app");
const loading = document.getElementById("loading");
const guide = document.getElementById("guide");
const captureBtn = document.getElementById("captureBtn");
const resetBtn = document.getElementById("resetBtn");

let scanAR;
let renderer;
let scene;
let camera;
let mascot;
let selfieVideo;
let selfieMode = false;

/* =========================
   START
========================= */
window.addEventListener("load", startScanner);

/* =========================
   STEP 1 - SCAN MARKER
========================= */
async function startScanner(){

try{

scanAR = new window.MINDAR.IMAGE.MindARThree({
container: app,
imageTargetSrc:"./targets.mind",
uiScanning:false,
uiLoading:false,
uiError:false,
videoSettings:{
facingMode:{ideal:"environment"}
}
});

renderer = scanAR.renderer;
scene = scanAR.scene;
camera = scanAR.camera;

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);

const light = new THREE.HemisphereLight(0xffffff,0xbbbbff,1.2);
scene.add(light);

/* character image */
const texture = await new THREE.TextureLoader().loadAsync("./anime-mascot.png");
texture.encoding = THREE.sRGBEncoding;

const material = new THREE.MeshBasicMaterial({
map:texture,
transparent:true,
alphaTest:0.35,
side:THREE.DoubleSide
});

mascot = new THREE.Mesh(
new THREE.PlaneGeometry(1.8,3.5),
material
);

mascot.position.set(0,1.2,0);

const anchor = scanAR.addAnchor(0);
anchor.group.add(mascot);

/* marker detected */
anchor.onTargetFound = async ()=>{
await enterSelfieMode();
};

await scanAR.start();

loading.style.display = "none";

renderer.setAnimationLoop(()=>{
renderer.render(scene,camera);
});

}catch(err){

loading.innerHTML = "カメラエラー";
console.error(err);

}

}

/* =========================
   STEP 2 - SELFIE MODE
========================= */
async function enterSelfieMode(){

if(selfieMode) return;
selfieMode = true;

guide.innerHTML = "② キャラクターと一緒に写真を撮ってください";

await scanAR.stop();

/* clear old camera */
app.innerHTML = "";

/* selfie camera */
selfieVideo = document.createElement("video");
selfieVideo.autoplay = true;
selfieVideo.playsInline = true;
selfieVideo.muted = true;
selfieVideo.style.transform = "scaleX(-1)";
app.appendChild(selfieVideo);

const stream = await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"user",
width:{ideal:1280},
height:{ideal:720}
},
audio:false
});

selfieVideo.srcObject = stream;
await selfieVideo.play();

/* three overlay */
renderer = new THREE.WebGLRenderer({
alpha:true,
antialias:true,
preserveDrawingBuffer:true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.domElement.style.pointerEvents = "none";

app.appendChild(renderer.domElement);

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
100
);

camera.position.z = 5;

const light = new THREE.HemisphereLight(0xffffff,0xbbbbff,1.2);
scene.add(light);

/* place character */
scene.add(mascot);
mascot.position.set(1.6,-1.0,0);

captureBtn.style.display = "block";
resetBtn.style.display = "block";

animateSelfie();

}

/* =========================
   SELFIE LOOP
========================= */
function animateSelfie(){

requestAnimationFrame(animateSelfie);

if(!selfieMode) return;

if(mascot){
mascot.lookAt(camera.position);
}

renderer.render(scene,camera);

}

/* =========================
   FLASH
========================= */
function flash(){

const el = document.getElementById("flash");

el.style.transition = "none";
el.style.opacity = "0.95";

setTimeout(()=>{
el.style.transition = "opacity .35s ease";
el.style.opacity = "0";
},40);

}

/* =========================
   TAKE PHOTO
========================= */
async function takePhoto(){

flash();

const out = document.createElement("canvas");
out.width = window.innerWidth;
out.height = window.innerHeight;

const ctx = out.getContext("2d");

/* selfie image */
ctx.save();
ctx.scale(-1,1);
ctx.drawImage(selfieVideo,-out.width,0,out.width,out.height);
ctx.restore();

/* character overlay */
ctx.drawImage(renderer.domElement,0,0,out.width,out.height);

/* save/share */
out.toBlob(async(blob)=>{

const file = new File(
[blob],
"ar-selfie.jpg",
{type:"image/jpeg"}
);

/* iPhone share sheet */
if(navigator.canShare && navigator.canShare({files:[file]})){

try{
await navigator.share({
files:[file],
title:"AR Photo"
});
return;
}catch(e){}

}

/* fallback */
const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;
a.download = "ar-selfie.jpg";
a.click();

setTimeout(()=>{
URL.revokeObjectURL(url);
},1000);

},"image/jpeg",0.95);

}

/* =========================
   RESET
========================= */
function resetApp(){
location.reload();
}

/* =========================
   EVENTS
========================= */
captureBtn.addEventListener("click",takePhoto);
resetBtn.addEventListener("click",resetApp);

window.addEventListener("resize",()=>{

if(renderer){
renderer.setSize(window.innerWidth,window.innerHeight);
}

if(camera){
camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
}

});
</script>

</body>
</html>
