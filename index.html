<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<title>AR Selfie Marker</title>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image-three.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:sans-serif;
}

#ar-container{
position:fixed;
inset:0;
width:100%;
height:100%;
}

#loading{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#000;
color:#fff;
font-size:18px;
z-index:50;
text-align:center;
padding:20px;
}

#guide{
position:fixed;
top:20px;
left:15px;
right:15px;
text-align:center;
color:#fff;
font-size:16px;
font-weight:bold;
z-index:20;
text-shadow:0 2px 8px rgba(0,0,0,.7);
}

#captureBtn{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
z-index:20;
border:none;
border-radius:16px;
padding:15px 30px;
font-size:20px;
font-weight:bold;
color:#fff;
background:linear-gradient(135deg,#ff5ca9,#ff84d2);
box-shadow:0 8px 20px rgba(0,0,0,.28);
}

#flash{
position:fixed;
inset:0;
background:#fff;
opacity:0;
pointer-events:none;
z-index:100;
}
</style>
</head>

<body>

<div id="ar-container"></div>

<div id="loading">Opening Selfie Camera...</div>
<div id="guide">マーカーを前カメラに映してください</div>
<div id="flash"></div>

<button id="captureBtn">📸 撮影</button>

<script>
let renderer, scene, camera, mascot;

window.addEventListener("load", startAR);

async function startAR(){

try{

const mindarThree = new window.MINDAR.IMAGE.MindARThree({
container: document.querySelector("#ar-container"),
imageTargetSrc:"./targets.mind",
uiScanning:false,
uiLoading:false,
uiError:false,
maxTrack:1,
filterMinCF:0.0001,
filterBeta:0.01
});

renderer = mindarThree.renderer;
scene = mindarThree.scene;
camera = mindarThree.camera;

/* FORÇA SELFIE CAMERA */
await mindarThree.start();

/* troca manualmente para frontal */
const video = document.querySelector("video");

const stream = await navigator.mediaDevices.getUserMedia({
video:{
facingMode:{ exact:"user" },
width:{ ideal:1280 },
height:{ ideal:720 }
},
audio:false
});

video.srcObject = stream;
await video.play();

/* espelho selfie */
video.style.transform = "scaleX(-1)";
video.style.objectFit = "cover";

renderer.preserveDrawingBuffer = true;
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);

const light = new THREE.HemisphereLight(0xffffff,0xbbbbff,1.2);
scene.add(light);

const texture = await new THREE.TextureLoader().loadAsync("./anime-mascot.png");
texture.encoding = THREE.sRGBEncoding;

const material = new THREE.MeshBasicMaterial({
map:texture,
transparent:true,
alphaTest:0.35,
side:THREE.DoubleSide
});

mascot = new THREE.Mesh(
new THREE.PlaneGeometry(1.1,2.4),
material
);

mascot.position.set(0,1.15,0);

const anchor = mindarThree.addAnchor(0);
anchor.group.add(mascot);

document.getElementById("loading").style.display="none";

renderer.setAnimationLoop(()=>{

if(mascot){
mascot.lookAt(camera.position);
}

renderer.render(scene,camera);

});

}catch(error){

document.getElementById("loading").innerHTML =
"Selfie camera failed.<br>Use HTTPS + allow camera.";

console.error(error);
}
}

/* FOTO */
function flashEffect(){
const flash = document.getElementById("flash");

flash.style.transition="none";
flash.style.opacity="0.95";

setTimeout(()=>{
flash.style.transition="opacity .35s ease";
flash.style.opacity="0";
},40);
}

function takePhoto(){

flashEffect();

renderer.render(scene,camera);

const glCanvas = renderer.domElement;
const video = document.querySelector("video");

const output = document.createElement("canvas");
output.width = glCanvas.width;
output.height = glCanvas.height;

const ctx = output.getContext("2d");

/* selfie espelhada */
ctx.save();
ctx.scale(-1,1);
ctx.drawImage(video,-output.width,0,output.width,output.height);
ctx.restore();

ctx.drawImage(glCanvas,0,0,output.width,output.height);

const link = document.createElement("a");
link.download = "ar-selfie.jpg";
link.href = output.toDataURL("image/jpeg",0.95);
link.click();
}

document.getElementById("captureBtn").addEventListener("click",takePhoto);

window.addEventListener("resize",()=>{
if(renderer){
renderer.setSize(window.innerWidth,window.innerHeight);
}
});
</script>

</body>
</html>
