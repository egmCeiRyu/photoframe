<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>MindAR Anime Mascot Photo Frame</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
  font-family: sans-serif;
  background: #000;
}

#title {
  position: fixed;
  top: 16px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #fff;
  font-size: 22px;
  font-weight: bold;
  z-index: 20;
  text-shadow: 0 2px 6px rgba(0,0,0,.7);
}

#ui {
  position: fixed;
  bottom: 28px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  z-index: 20;
}

#captureBtn {
  border: none;
  border-radius: 14px;
  padding: 14px 28px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  background: linear-gradient(135deg,#ff5aa8,#ff7fd0);
  box-shadow: 0 8px 18px rgba(0,0,0,.25);
}

#guide {
  position: fixed;
  bottom: 90px;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 14px;
  z-index: 20;
  text-shadow: 0 2px 6px rgba(0,0,0,.7);
}
</style>
</head>

<body>

<div id="title">AR Anime Mascot Photo Frame</div>
<div id="guide">マーカーをカメラに映してください</div>

<div id="ui">
  <button id="captureBtn">📸 撮影</button>
</div>

<script>
let renderer, scene, camera, mascot;

async function startAR() {

  const mindarThree = new window.MINDAR.IMAGE.MindARThree({
    container: document.body,
    imageTargetSrc: "./targets.mind"
  });

  renderer = mindarThree.renderer;
  scene = mindarThree.scene;
  camera = mindarThree.camera;

  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.2);
  scene.add(light);

  const anchor = mindarThree.addAnchor(0);

  const loader = new THREE.TextureLoader();

  const texture = await loader.loadAsync(
    "./anime-mascot.png"
  );

  const geometry = new THREE.PlaneGeometry(1.1, 2.4);

  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true
  });

  mascot = new THREE.Mesh(geometry, material);
  mascot.position.set(0, 1.15, 0);

  anchor.group.add(mascot);

  await mindarThree.start();

  renderer.setAnimationLoop(() => {

    if (mascot) {
      mascot.lookAt(camera.position);
    }

    renderer.render(scene, camera);
  });
}

function takePhoto() {
  const canvas = document.querySelector("canvas");
  if (!canvas) return;

  const link = document.createElement("a");
  link.download = "ar-photo.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

document.getElementById("captureBtn").addEventListener("click", takePhoto);

startAR();
</script>

</body>
</html>
