<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<title>AR Anime Mascot Photo Frame</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>
<script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image-three.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:sans-serif;
}

#ar-container{
position:fixed;
inset:0;
width:100%;
height:100%;
}

#title{
position:fixed;
top:14px;
left:0;
width:100%;
text-align:center;
color:#fff;
font-size:22px;
font-weight:bold;
z-index:20;
text-shadow:0 2px 8px rgba(0,0,0,.7);
}

#guide{
position:fixed;
bottom:95px;
left:0;
width:100%;
text-align:center;
color:#fff;
font-size:15px;
z-index:20;
text-shadow:0 2px 8px rgba(0,0,0,.7);
}

#captureBtn{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
z-index:20;
border:none;
border-radius:14px;
padding:14px 28px;
font-size:18px;
font-weight:bold;
color:#fff;
background:linear-gradient(135deg,#ff5ca9,#ff84d2);
box-shadow:0 8px 20px rgba(0,0,0,.25);
}

#loading{
position:fixed;
inset:0;
background:#000;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
z-index:99;
font-size:18px;
}
</style>
</head>

<body>

<div id="ar-container"></div>

<div id="loading">Opening Camera...</div>
<div id="title">AR Anime Mascot Photo Frame</div>
<div id="guide">マーカーをカメラに映してください</div>
<button id="captureBtn">📸 撮影</button>

<script>
async function startAR(){
try{

const mindarThree = new window.MINDAR.IMAGE.MindARThree({
container: document.querySelector("#ar-container"),
imageTargetSrc:"./targets.mind",
uiScanning:false,
uiLoading:false,
uiError:false
});

const {renderer, scene, camera} = mindarThree;

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);

const light = new THREE.HemisphereLight(0xffffff,0xbbbbff,1.2);
scene.add(light);

const loader = new THREE.TextureLoader();
const texture = await loader.loadAsync("./anime-mascot.png");

const mascot = new THREE.Mesh(
new THREE.PlaneGeometry(1.1,2.4),
new THREE.MeshBasicMaterial({
map:texture,
transparent:true
})
);

mascot.position.set(0,1.15,0);

const anchor = mindarThree.addAnchor(0);
anchor.group.add(mascot);

await mindarThree.start();

document.getElementById("loading").style.display="none";

renderer.setAnimationLoop(()=>{
mascot.lookAt(camera.position);
renderer.render(scene,camera);
});

}catch(error){
document.getElementById("loading").innerHTML =
"Failed to open camera.<br>Allow permission and reload.";
console.error(error);
}
}

window.addEventListener("load", startAR);

document.getElementById("captureBtn").addEventListener("click",()=>{
const canvas = document.querySelector("canvas");
if(!canvas) return;

const link = document.createElement("a");
link.download = "ar-photo.png";
link.href = canvas.toDataURL("image/png");
link.click();
});
</script>

</body>
</html>
