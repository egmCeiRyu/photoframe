<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<title>ARフォトフレーム FINAL</title>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image-three.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}

#app{
position:fixed;
inset:0;
overflow:hidden;
background:#000;
}

video,canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}

#loading{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#000;
color:#fff;
font-size:18px;
z-index:100;
}

#guide{
position:fixed;
top:18px;
left:15px;
right:15px;
z-index:30;
text-align:center;
color:#fff;
font-size:17px;
font-weight:700;
text-shadow:0 2px 8px rgba(0,0,0,.75);
line-height:1.5;
}

#resetBtn{
position:fixed;
bottom:36px;
left:22px;
width:58px;
height:58px;
border:none;
border-radius:50%;
font-size:26px;
color:#fff;
background:rgba(255,255,255,.18);
backdrop-filter:blur(8px);
z-index:40;
display:none;
cursor:pointer;
}

#captureBtn{
position:fixed;
bottom:26px;
left:50%;
transform:translateX(-50%);
width:88px;
height:88px;
border:none;
background:transparent;
padding:0;
z-index:40;
display:none;
cursor:pointer;
}

#captureBtn:active{
transform:translateX(-50%) scale(.92);
}

#captureBtn .outer-ring{
position:absolute;
inset:0;
border-radius:50%;
background:#ff0000;
}

#captureBtn .outer-ring::after{
content:"";
position:absolute;
inset:7px;
border-radius:50%;
background:#fff;
}

#captureBtn .inner-red{
position:absolute;
inset:12px;
border-radius:50%;
background:#ff0000;
}

#flash{
position:fixed;
inset:0;
background:#fff;
opacity:0;
pointer-events:none;
z-index:90;
}
</style>
</head>
<body>

<div id="app"></div>

<div id="loading">カメラを起動しています...</div>
<div id="guide">① マーカーをスキャンしてください</div>

<button id="captureBtn">
<span class="outer-ring"></span>
<span class="inner-red"></span>
</button>

<button id="resetBtn">↺</button>

<div id="flash"></div>

<script>
const app = document.getElementById("app");
const loading = document.getElementById("loading");
const guide = document.getElementById("guide");
const captureBtn = document.getElementById("captureBtn");
const resetBtn = document.getElementById("resetBtn");

let scanAR, renderer, scene, camera, mascot, selfieVideo;
let selfieMode = false;

window.addEventListener("load", startScanner);

async function startScanner(){

try{

scanAR = new window.MINDAR.IMAGE.MindARThree({
container: app,
imageTargetSrc:"./targets.mind",
uiScanning:false,
uiLoading:false,
uiError:false,
videoSettings:{ facingMode:{ideal:"environment"} }
});

renderer = scanAR.renderer;
scene = scanAR.scene;
camera = scanAR.camera;

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);

scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1.3));

const texture = await new THREE.TextureLoader().loadAsync("./anime-mascot.png");
texture.encoding = THREE.sRGBEncoding;

mascot = new THREE.Mesh(
new THREE.PlaneGeometry(2.8,4.2),
new THREE.MeshBasicMaterial({
map:texture,
transparent:true,
alphaTest:0.2
})
);

const anchor = scanAR.addAnchor(0);
anchor.group.add(mascot);

anchor.onTargetFound = async ()=>{
await enterSelfieMode();
};

await scanAR.start();

loading.style.display="none";

renderer.setAnimationLoop(()=>{
renderer.render(scene,camera);
});

}catch(e){
loading.innerHTML="カメラエラー";
}
}

async function enterSelfieMode(){

if(selfieMode) return;
selfieMode = true;

guide.innerHTML="② キャラクターと一緒に写真を撮ってください";

await scanAR.stop();

app.innerHTML="";

selfieVideo = document.createElement("video");
selfieVideo.autoplay=true;
selfieVideo.playsInline=true;
selfieVideo.muted=true;
selfieVideo.style.transform="scaleX(-1)";
app.appendChild(selfieVideo);

const stream = await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"user",
width:{ideal:1280},
height:{ideal:720}
},
audio:false
});

selfieVideo.srcObject=stream;
await selfieVideo.play();

renderer = new THREE.WebGLRenderer({
alpha:true,
antialias:true,
preserveDrawingBuffer:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.domElement.style.pointerEvents="none";

app.appendChild(renderer.domElement);

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(
28,
innerWidth/innerHeight,
0.1,
100
);

camera.position.z=9;

scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1.4));

scene.add(mascot);

/* 50% MENOR */
mascot.scale.set(0.70,0.70,0.70);
mascot.position.set(0.95,-0.3,0);

captureBtn.style.display="block";
resetBtn.style.display="block";

animateSelfie();
}

function animateSelfie(){

requestAnimationFrame(animateSelfie);

if(!selfieMode) return;

mascot.position.y=
-1.10 + Math.sin(Date.now()*0.002)*0.04;

renderer.render(scene,camera);
}

function flash(){

const el=document.getElementById("flash");
el.style.transition="none";
el.style.opacity="0.95";

setTimeout(()=>{
el.style.transition="opacity .35s ease";
el.style.opacity="0";
},40);
}

async function takePhoto(){

flash();

const out=document.createElement("canvas");
out.width=innerWidth;
out.height=innerHeight;

const ctx=out.getContext("2d");

const vw=selfieVideo.videoWidth;
const vh=selfieVideo.videoHeight;
const cw=out.width;
const ch=out.height;

const vr=vw/vh;
const cr=cw/ch;

let sx,sy,sw,sh;

if(vr>cr){
sh=vh;
sw=vh*cr;
sx=(vw-sw)/2;
sy=0;
}else{
sw=vw;
sh=vw/cr;
sx=0;
sy=(vh-sh)/2;
}

ctx.save();
ctx.scale(-1,1);

ctx.drawImage(
selfieVideo,
sx,sy,sw,sh,
-cw,0,cw,ch
);

ctx.restore();

ctx.drawImage(renderer.domElement,0,0,cw,ch);

out.toBlob(async(blob)=>{

const file=new File([blob],"ar-selfie.jpg",{type:"image/jpeg"});

if(navigator.canShare && navigator.canShare({files:[file]})){
try{
await navigator.share({
files:[file],
title:"AR Photo"
});
return;
}catch(e){}
}

const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="ar-selfie.jpg";
a.click();

setTimeout(()=>URL.revokeObjectURL(url),1000);

},"image/jpeg",1.0);
}

function resetApp(){
location.reload();
}

captureBtn.addEventListener("click",takePhoto);
resetBtn.addEventListener("click",resetApp);

window.addEventListener("resize",()=>{

if(renderer) renderer.setSize(innerWidth,innerHeight);

if(camera){
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
}

});
</script>

</body>
</html>
